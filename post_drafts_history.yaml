      - "節約しろ副業しろってよく言われるけど、手取りが増えない話は誰もしない。\n\n頑張って支出削っても、社会保険料と税金でじわじわ持ってかれる速度の方が正直速い。個人の努力でどうにかなる範囲と、そうじゃない範囲を分けて考えないと、ただ疲弊するだけになる。\n\n節約と副業、正直どこまで個人の責任だと思う?"
      - "親世代が羨ましいのは資産じゃなくて、\"この先も大体良くなる\"って信じて生きてた時間だと思う。\n\n今は誰もそんな顔してない。だから自分の場合は、未来が良くなる前提で計画するのをやめた。増えたら儲けもの、くらいの温度でいる方が気持ちが保てる。\n\n将来、今より良くなると思ってる?"
      - "お金の話、切り出した瞬間に空気変わるの何なんだろうな。\n\n奢った奢られたの話ならまだしも、資産や投資の話になると急に探り合いが始まる。別に自慢したいわけでも詮索したいわけでもなくて、単純に情報交換したいだけなんだけど、その温度感が伝わりにくい。\n\nお金の話、素直にできる相手何人いる?"
